      <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GRID DUEL - Turn-Based Multiplayer</title>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d14;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f8fafc;
        }

        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #172236 0%, #070a10 100%);
            z-index: 100;
            padding: 20px;
        }

        .hidden { display: none !important; }

        h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #38bdf8;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 22px;
            letter-spacing: 1px;
        }

        .card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.75);
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 6px;
            letter-spacing: 0.6px;
        }

        input[type="text"], select {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            user-select: auto;
            -webkit-user-select: auto;
        }

        input[type="text"]:focus, select:focus {
            border-color: #38bdf8;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn {
            flex: 1;
            background: #0284c7;
            color: #ffffff;
            border: none;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:active { transform: scale(0.97); }
        .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .btn.green { background: #10b981; }
        .btn.gray { background: #475569; }
        .btn.amber { background: #d97706; }

        #status-msg {
            text-align: center;
            margin-top: 14px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #38bdf8;
            min-height: 20px;
        }

        /* GAME LAYOUT */
        #game-screen {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px 16px;
            background: radial-gradient(circle at center, #111927 0%, #070a10 100%);
        }

        .top-hud {
            width: 100%;
            max-width: 540px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 14px;
            gap: 8px;
        }

        .player-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 0.9rem;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .turn-banner {
            text-align: center;
            font-weight: 900;
            font-size: 0.95rem;
            padding: 6px 16px;
            border-radius: 999px;
            letter-spacing: 0.6px;
            margin: 6px 0;
        }

        .turn-mine {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.5);
        }

        .turn-enemy {
            background: rgba(244, 63, 94, 0.16);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.4);
        }

        /* 7x7 GRID */
        #board-wrap {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-height: 62vh;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(7, 1fr);
            gap: 5px;
            width: min(86vw, 56vh, 460px);
            height: min(86vw, 56vh, 460px);
            background: #0f172a;
            padding: 8px;
            border-radius: 14px;
            border: 2px solid rgba(56, 189, 248, 0.25);
        }

        .cell {
            background: #162033;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            transition: background 0.12s, transform 0.1s, border-color 0.12s;
        }

        .cell.reachable {
            border-color: rgba(52, 211, 153, 0.7);
            background: rgba(16, 185, 129, 0.14);
        }

        .cell.targetable {
            border-color: rgba(248, 113, 113, 0.85);
            background: rgba(239, 68, 68, 0.18);
        }

        .cell.wall {
            background: #283548;
            border-color: #475569;
            cursor: not-allowed;
        }

        .cell.orb-tile {
            box-shadow: inset 0 0 0 2px rgba(251, 191, 36, 0.65);
        }

        .orb-mark {
            font-size: 0.7rem;
            font-weight: 900;
            color: #fbbf24;
            position: absolute;
            bottom: 3px;
        }

        .unit {
            width: 72%;
            height: 72%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            font-size: 0.68rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 1px 2px #000;
            pointer-events: none;
        }

        /* ACTION DOCK */
        .action-dock {
            width: 100%;
            max-width: 460px;
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .mode-btn {
            flex: 1;
            padding: 11px 8px;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #e2e8f0;
            font-weight: 800;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }

        .mode-btn.active-move {
            background: #059669;
            border-color: #34d399;
            color: #ffffff;
        }

        .mode-btn.active-shoot {
            background: #dc2626;
            border-color: #f87171;
            color: #ffffff;
        }

        .mode-btn.active-pulse {
            background: #d97706;
            border-color: #fbbf24;
            color: #ffffff;
        }

        /* CHAT WIDGET */
        #chat-btn {
            position: relative;
            background: #1e293b;
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        #chat-dot {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 11px;
            height: 11px;
            background: #ef4444;
            border-radius: 50%;
            border: 2px solid #0f172a;
        }

        #chat-drawer {
            position: fixed;
            top: 66px;
            right: 14px;
            width: 280px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            padding: 10px;
            z-index: 60;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65);
        }

        #chat-log {
            height: 145px;
            overflow-y: auto;
            font-size: 0.84rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }

        #chat-form {
            display: flex;
            gap: 6px;
        }

        #chat-input {
            flex: 1;
            padding: 8px 10px;
            font-size: 0.84rem;
            border-radius: 8px;
        }

        #chat-send {
            background: #0284c7;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen">
        <h1>GRID DUEL</h1>
        <div class="subtitle">Turn-Based Tactical Multiplayer</div>

        <div class="card">
            <div class="field">
                <label>Your Name</label>
                <input type="text" id="name-input" maxlength="12" value="Player" placeholder="Enter name">
            </div>

            <div class="field">
                <label>Unit Color</label>
                <select id="color-select">
                    <option value="#0284c7">Cobalt</option>
                    <option value="#e11d48">Crimson</option>
                    <option value="#059669">Emerald</option>
                    <option value="#d97706">Amber</option>
                    <option value="#7c3aed">Violet</option>
                </select>
            </div>

            <div class="field">
                <label>6-Digit Room Code (To Join)</label>
                <input type="text" id="code-input" maxlength="6" placeholder="Leave empty to create room">
            </div>

            <div class="btn-row">
                <button id="create-btn" class="btn green">Create Room</button>
                <button id="join-btn" class="btn">Join Room</button>
            </div>

            <div id="status-msg">Ready</div>
        </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen hidden">
        <div class="top-hud">
            <div class="player-pill">
                <span class="color-dot" id="hud-p1-dot"></span>
                <span id="hud-p1-name">P1</span>:
                <span id="hud-p1-score">0</span>
            </div>

            <div style="text-align:center; font-size:0.78rem; color:#94a3b8; font-weight:700;">
                <div>ROUND <span id="round-num">1</span>/12</div>
                <div style="color:#38bdf8;">AP: <span id="ap-num">2</span>/2</div>
            </div>

            <div class="player-pill">
                <span id="hud-p2-score">0</span>:
                <span id="hud-p2-name">P2</span>
                <span class="color-dot" id="hud-p2-dot"></span>
            </div>

            <button id="chat-btn" title="Chat">
                💬
                <span id="chat-dot" class="hidden"></span>
            </button>
        </div>

        <div id="chat-drawer" class="hidden">
            <div id="chat-log"></div>
            <form id="chat-form">
                <input type="text" id="chat-input" maxlength="80" placeholder="Type message..." autocomplete="off">
                <button type="submit" id="chat-send">Send</button>
            </form>
        </div>

        <div id="turn-banner" class="turn-banner turn-enemy">WAITING FOR TURN...</div>

        <div id="board-wrap">
            <div id="grid"></div>
        </div>

        <div class="action-dock">
            <button id="mode-move" class="mode-btn active-move">Move (1 AP)</button>
            <button id="mode-shoot" class="mode-btn">Shot (1 AP)</button>
            <button id="mode-pulse" class="mode-btn">Pulse (2 AP)</button>
            <button id="end-turn-btn" class="mode-btn" style="background:#334155;">End Turn</button>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="screen hidden">
        <div class="card" style="text-align:center;">
            <h1 id="end-title" style="font-size:1.9rem;">MATCH OVER</h1>
            <p id="end-score" style="font-size:1.4rem; font-weight:900; color:#fbbf24; margin:14px 0;">0 - 0</p>
            <div class="btn-row">
                <button id="rematch-btn" class="btn green">Rematch</button>
                <button id="quit-btn" class="btn gray">Lobby</button>
            </div>
        </div>
    </div>

    <script>
        /* =========================================================================
           FIREBASE CONFIG (SAME PROJECT AS LAPBALL)
           ========================================================================= */
        const firebaseConfig = {
            apiKey: "AIzaSyCtjyvXA2LEhHrQ34m-iYovP0Mmm8VSZX0",
            authDomain: "lapball-4e275.firebaseapp.com",
            databaseURL: "https://lapball-4e275-default-rtdb.firebaseio.com",
            projectId: "lapball-4e275",
            storageBucket: "lapball-4e275.firebasestorage.app",
            messagingSenderId: "76325040450",
            appId: "1:76325040450:web:fa15769f18838ffad118db"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        /* =========================================================================
           TURN-BASED GAME STATE
           ========================================================================= */
        const GRID_SIZE = 7;
        const WIN_SCORE = 5;
        const MAX_ROUNDS = 12;

        // Fixed tactical cover tiles (row, col)
        const WALLS = new Set([
            "1,2", "2,2",
            "4,4", "5,4",
            "3,3"
        ]);

        let roomRef = null;
        let mySeat = 1; // 1 = Host, 2 = Guest
        let myName = "Player";
        let myColor = "#0284c7";
        let peerName = "Opponent";
        let peerColor = "#e11d48";

        let actionMode = "move"; // "move" | "shoot" | "pulse"

        // Authoritative shared state synced via Firebase
        let state = {
            turnSeat: 1,      // Whose turn it is (1 or 2)
            ap: 2,            // Remaining action points this turn
            round: 1,
            gameOver: false,
            winnerText: "",
            orb: { r: 0, c: 3 },
            p1: { r: 3, c: 0, hp: 100, score: 0 },
            p2: { r: 3, c: 6, hp: 100, score: 0 }
        };

        /* =========================================================================
           LOBBY & ROOM SETUP
           ========================================================================= */
        const statusMsg = document.getElementById('status-msg');

        document.getElementById('create-btn').addEventListener('click', () => {
            myName = document.getElementById('name-input').value.trim() || "Host";
            myColor = document.getElementById('color-select').value;
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('code-input').value = code;

            mySeat = 1;
            roomRef = db.ref('gridduel_rooms/' + code);
            roomRef.onDisconnect().remove();

            document.getElementById('create-btn').disabled = true;
            document.getElementById('join-btn').disabled = true;
            statusMsg.textContent = `Room ${code} created. Waiting for player 2...`;

            roomRef.set({
                phase: 'waiting',
                host: { name: myName, color: myColor }
            }).then(() => {
                roomRef.child('guest').on('value', snap => {
                    if (snap.exists() && document.getElementById('game-screen').classList.contains('hidden')) {
                        const g = snap.val();
                        peerName = g.name;
                        peerColor = (g.color === myColor) ? "#e11d48" : g.color;

                        const initial = freshMatchState();
                        roomRef.update({
                            phase: 'active',
                            state: initial
                        });
                        startTurnGame();
                    }
                });
            });
        });

        document.getElementById('join-btn').addEventListener('click', () => {
            const code = document.getElementById('code-input').value.trim();
            if (code.length !== 6) {
                statusMsg.textContent = "Please enter a 6-digit room code.";
                return;
            }

            myName = document.getElementById('name-input').value.trim() || "Guest";
            myColor = document.getElementById('color-select').value;
            mySeat = 2;
            roomRef = db.ref('gridduel_rooms/' + code);

            document.getElementById('create-btn').disabled = true;
            document.getElementById('join-btn').disabled = true;
            statusMsg.textContent = "Joining room...";

            roomRef.once('value', snap => {
                if (!snap.exists() || snap.val().phase !== 'waiting') {
                    statusMsg.textContent = "Room unavailable or already in match.";
                    document.getElementById('create-btn').disabled = false;
                    document.getElementById('join-btn').disabled = false;
                    return;
                }

                const h = snap.val().host;
                peerName = h.name;
                peerColor = h.color;
                if (myColor === peerColor) myColor = "#059669";

                roomRef.child('guest').onDisconnect().remove();
                roomRef.child('guest').set({ name: myName, color: myColor });

                roomRef.child('phase').on('value', pSnap => {
                    if (!pSnap.exists()) {
                        alert("Room closed.");
                        location.reload();
                    } else if (pSnap.val() === 'active' && document.getElementById('game-screen').classList.contains('hidden')) {
                        startTurnGame();
                    }
                });
            });
        });

        function freshMatchState() {
            return {
                turnSeat: 1,
                ap: 2,
                round: 1,
                gameOver: false,
                winnerText: "",
                orb: { r: 0, c: 3 },
                p1: { r: 3, c: 0, hp: 100, score: 0 },
                p2: { r: 3, c: 6, hp: 100, score: 0 }
            };
        }

        /* =========================================================================
           TURN SYNC, CHAT & REMATCH LISTENERS
           ========================================================================= */
        function startTurnGame() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            const p1C = mySeat === 1 ? myColor : peerColor;
            const p2C = mySeat === 1 ? peerColor : myColor;
            const p1N = mySeat === 1 ? myName : peerName;
            const p2N = mySeat === 1 ? peerName : myName;

            document.getElementById('hud-p1-dot').style.background = p1C;
            document.getElementById('hud-p2-dot').style.background = p2C;
            document.getElementById('hud-p1-name').textContent = p1N;
            document.getElementById('hud-p2-name').textContent = p2N;

            buildGridCells();

            roomRef.child('state').on('value', snap => {
                if (!snap.exists()) return;
                state = snap.val();
                renderAll();

                if (state.gameOver) {
                    showEndScreen();
                } else {
                    document.getElementById('end-screen').classList.add('hidden');
                }
            });

            roomRef.child('chat').on('child_added', snap => {
                const msg = snap.val();
                const line = document.createElement('div');
                const safe = msg.text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                line.innerHTML = `<strong style="color:${msg.color}">${msg.sender}:</strong> ${safe}`;
                const log = document.getElementById('chat-log');
                log.appendChild(line);
                log.scrollTop = log.scrollHeight;

                if (document.getElementById('chat-drawer').classList.contains('hidden')) {
                    document.getElementById('chat-dot').classList.remove('hidden');
                }
            });

            roomRef.child('rematch').on('value', snap => {
                if (!snap.exists()) return;
                const r = snap.val();
                if (r.s1 && r.s2) {
                    if (mySeat === 1) {
                        roomRef.child('rematch').remove();
                        roomRef.child('state').set(freshMatchState());
                    }
                    document.getElementById('rematch-btn').disabled = false;
                    document.getElementById('rematch-btn').textContent = "Rematch";
                } else {
                    const btn = document.getElementById('rematch-btn');
                    if ((mySeat === 1 && r.s2) || (mySeat === 2 && r.s1)) {
                        btn.textContent = "Accept Rematch";
                    }
                }
            });
        }

        /* =========================================================================
           TURN ACTIONS (MOVE, SHOT, PULSE, END TURN)
           ========================================================================= */
        function isMyTurn() {
            return !state.gameOver && state.turnSeat === mySeat;
        }

        function setMode(newMode) {
            actionMode = newMode;
            document.getElementById('mode-move').classList.toggle('active-move', newMode === 'move');
            document.getElementById('mode-shoot').classList.toggle('active-shoot', newMode === 'shoot');
            document.getElementById('mode-pulse').classList.toggle('active-pulse', newMode === 'pulse');
            renderAll();
        }

        document.getElementById('mode-move').addEventListener('click', () => setMode('move'));
        document.getElementById('mode-shoot').addEventListener('click', () => setMode('shoot'));
        document.getElementById('mode-pulse').addEventListener('click', () => {
            if (!isMyTurn() || state.ap < 2) return;
            // Pulse triggers immediately around your unit for 2 AP
            const me = mySeat === 1 ? state.p1 : state.p2;
            const foe = mySeat === 1 ? state.p2 : state.p1;
            const dist = Math.abs(me.r - foe.r) + Math.abs(me.c - foe.c);

            state.ap -= 2;
            if (dist <= 2) {
                foe.hp -= 20;
                // Push foe away if adjacent
                const dr = Math.sign(foe.r - me.r);
                const dc = Math.sign(foe.c - me.c);
                const nr = Math.max(0, Math.min(GRID_SIZE - 1, foe.r + dr));
                const nc = Math.max(0, Math.min(GRID_SIZE - 1, foe.c + dc));
                if (!WALLS.has(`${nr},${nc}`) && !(nr === me.r && nc === me.c)) {
                    foe.r = nr;
                    foe.c = nc;
                }
                checkKnockout(mySeat, foe);
            }
            finalizeAction();
        });

        document.getElementById('end-turn-btn').addEventListener('click', () => {
            if (!isMyTurn()) return;
            advanceTurn();
        });

        function handleTileClick(r, c) {
            if (!isMyTurn()) return;

            const me = mySeat === 1 ? state.p1 : state.p2;
            const foe = mySeat === 1 ? state.p2 : state.p1;
            const manhattan = Math.abs(me.r - r) + Math.abs(me.c - c);

            if (actionMode === 'move') {
                if (state.ap < 1) return;
                if (manhattan !== 1) return;
                if (WALLS.has(`${r},${c}`)) return;
                if (r === foe.r && c === foe.c) return;

                me.r = r;
                me.c = c;
                state.ap -= 1;

                // Collect Overcharge Orb (+2 score & +25 HP)
                if (state.orb && r === state.orb.r && c === state.orb.c) {
                    me.score += 2;
                    me.hp = Math.min(100, me.hp + 25);
                    state.orb = {
                        r: state.orb.r === 0 ? 6 : 0,
                        c: state.orb.c === 3 ? (mySeat === 1 ? 4 : 2) : 3
                    };
                }

                checkWinCondition();
                finalizeAction();
            } else if (actionMode === 'shoot') {
                if (state.ap < 1) return;
                if (manhattan > 3 || manhattan === 0) return;

                // Line-of-sight check along row or col
                if (r === foe.r && c === foe.c) {
                    foe.hp -= 25;
                    state.ap -= 1;
                    checkKnockout(mySeat, foe);
                    finalizeAction();
                } else {
                    // Firing at empty/wall tile still costs 1 AP
                    state.ap -= 1;
                    finalizeAction();
                }
            }
        }

        function checkKnockout(attackerSeat, victim) {
            if (victim.hp <= 0) {
                const attacker = attackerSeat === 1 ? state.p1 : state.p2;
                attacker.score += 1;
                victim.hp = 100;
                if (victim === state.p1) {
                    state.p1.r = 3; state.p1.c = 0;
                } else {
                    state.p2.r = 3; state.p2.c = 6;
                }
                checkWinCondition();
            }
        }

        function checkWinCondition() {
            if (state.p1.score >= WIN_SCORE) {
                state.gameOver = true;
                state.winnerText = `${document.getElementById('hud-p1-name').textContent} WINS!`;
            } else if (state.p2.score >= WIN_SCORE) {
                state.gameOver = true;
                state.winnerText = `${document.getElementById('hud-p2-name').textContent} WINS!`;
            }
        }

        function finalizeAction() {
            if (!state.gameOver && state.ap <= 0) {
                advanceTurn();
            } else {
                roomRef.child('state').set(state);
            }
        }

        function advanceTurn() {
            if (state.turnSeat === 2) {
                state.round += 1;
                if (state.round > MAX_ROUNDS) {
                    state.gameOver = true;
                    if (state.p1.score > state.p2.score) {
                        state.winnerText = `${document.getElementById('hud-p1-name').textContent} WINS!`;
                    } else if (state.p2.score > state.p1.score) {
                        state.winnerText = `${document.getElementById('hud-p2-name').textContent} WINS!`;
                    } else {
                        state.winnerText = "DRAW MATCH!";
                    }
                }
            }

            if (!state.gameOver) {
                state.turnSeat = state.turnSeat === 1 ? 2 : 1;
                state.ap = 2;
            }
            actionMode = 'move';
            roomRef.child('state').set(state);
        }

        /* =========================================================================
           GRID RENDERING & UI
           ========================================================================= */
        function buildGridCells() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.addEventListener('click', () => handleTileClick(r, c));
                    grid.appendChild(cell);
                }
            }
        }

        function renderAll() {
            document.getElementById('hud-p1-score').textContent = state.p1.score;
            document.getElementById('hud-p2-score').textContent = state.p2.score;
            document.getElementById('round-num').textContent = Math.min(state.round, MAX_ROUNDS);
            document.getElementById('ap-num').textContent = state.ap;

            const banner = document.getElementById('turn-banner');
            if (isMyTurn()) {
                banner.textContent = `YOUR TURN (${state.ap} AP LEFT)`;
                banner.className = "turn-banner turn-mine";
            } else {
                banner.textContent = `${peerName.toUpperCase()}'S TURN`;
                banner.className = "turn-banner turn-enemy";
            }

            document.getElementById('mode-move').classList.toggle('active-move', actionMode === 'move');
            document.getElementById('mode-shoot').classList.toggle('active-shoot', actionMode === 'shoot');
            document.getElementById('mode-pulse').classList.toggle('active-pulse', actionMode === 'pulse');

            const me = mySeat === 1 ? state.p1 : state.p2;
            const foe = mySeat === 1 ? state.p2 : state.p1;
            const p1Color = mySeat === 1 ? myColor : peerColor;
            const p2Color = mySeat === 1 ? peerColor : myColor;

            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = Number(cell.dataset.r);
                const c = Number(cell.dataset.c);
                const key = `${r},${c}`;
                const dist = Math.abs(me.r - r) + Math.abs(me.c - c);

                cell.className = 'cell';
                cell.innerHTML = '';

                if (WALLS.has(key)) {
                    cell.classList.add('wall');
                    cell.innerHTML = `<span style="font-size:0.65rem; color:#94a3b8; font-weight:800;">BLK</span>`;
                }

                if (state.orb && state.orb.r === r && state.orb.c === c) {
                    cell.classList.add('orb-tile');
                    const orbTag = document.createElement('span');
                    orbTag.className = 'orb-mark';
                    orbTag.textContent = '+2';
                    cell.appendChild(orbTag);
                }

                if (isMyTurn() && !WALLS.has(key)) {
                    if (actionMode === 'move' && dist === 1 && !(r === foe.r && c === foe.c)) {
                        cell.classList.add('reachable');
                    } else if (actionMode === 'shoot' && dist >= 1 && dist <= 3) {
                        cell.classList.add('targetable');
                    }
                }

                if (state.p1.r === r && state.p1.c === c) {
                    const u = document.createElement('div');
                    u.className = 'unit';
                    u.style.background = p1Color;
                    u.innerHTML = `<span>P1</span><span>${state.p1.hp}</span>`;
                    cell.appendChild(u);
                }

                if (state.p2.r === r && state.p2.c === c) {
                    const u = document.createElement('div');
                    u.className = 'unit';
                    u.style.background = p2Color;
                    u.innerHTML = `<span>P2</span><span>${state.p2.hp}</span>`;
                    cell.appendChild(u);
                }
            });
        }

        function showEndScreen() {
            document.getElementById('end-screen').classList.remove('hidden');
            document.getElementById('end-title').textContent = state.winnerText || "MATCH OVER";
            document.getElementById('end-score').textContent = `${state.p1.score} - ${state.p2.score}`;
        }

        /* =========================================================================
           CHAT & END CONTROLS
           ========================================================================= */
        document.getElementById('chat-btn').addEventListener('click', () => {
            const drawer = document.getElementById('chat-drawer');
            drawer.classList.toggle('hidden');
            if (!drawer.classList.contains('hidden')) {
                document.getElementById('chat-dot').classList.add('hidden');
                document.getElementById('chat-input').focus();
            }
        });

        document.getElementById('chat-form').addEventListener('submit', e => {
            e.preventDefault();
            const inp = document.getElementById('chat-input');
            const txt = inp.value.trim();
            if (!txt || !roomRef) return;
            roomRef.child('chat').push({
                sender: myName,
                color: myColor,
                text: txt
            });
            inp.value = "";
        });

        document.getElementById('rematch-btn').addEventListener('click', () => {
            if (!roomRef) return;
            document.getElementById('rematch-btn').disabled = true;
            document.getElementById('rematch-btn').textContent = "Waiting...";
            roomRef.child(mySeat === 1 ? 'rematch/s1' : 'rematch/s2').set(true);
        });

        document.getElementById('quit-btn').addEventListener('click', () => {
            if (roomRef && mySeat === 1) roomRef.remove();
            location.reload();
        });
    </script>
</body>
</html>
